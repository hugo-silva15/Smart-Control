<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <img src="assets/images/Capturar.PNG" alt="Logo da empresa">
    <img src="assets/images/Capturar_2.PNG" alt="Menu">
    <form method="post">
        <h1>Crie sua conta</h1>

        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome..." required>

        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail..." required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha..." required minlength="8">

        <label for="acesso">Selecione um nível de acesso</label>
        <select name="nivelAcesso" id="acesso" required>
            <option value="" selected hidden>Selecione um nível de acesso</option>
            <option value="admin">Administrador</option>
            <option value="moderador">Moderador</option>
            <option value="membro">Membro</option>
        </select>

        <details>
            <summary>Termos de uso</summary>
            <p>Eu autorizo</p>
            <label for="termos">Eu li tudo</label>
            <input type="checkbox" id="termos" required>
        </details>

        <button><a href="dashboard.html">Cadastrar</a></button>
        <a href="index.html"><h4>Já tenho conta</h4></a>
    </form>
</body>
</html>
