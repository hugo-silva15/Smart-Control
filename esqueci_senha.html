<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha</title>
</head>
<body>
    <img src="assets/images/Capturar.PNG" alt="Imagem de uma lâmpada">
    <img src="assets/images/Capturar_2.PNG" alt="Menu">
    <img src="assets/images/logo.png" alt="Logo da empresa">
    <h1>Redefinir senha</h1>
    <form method="post" action="index.html">
        <label for="senha">Senha</label>
        <input type="password" id="senha"  placeholder="Enter..."  required minlength="8">
        <label for="confirmar_senha">Confirmar senha</label>
        <input type="password" id="confirmar_senha" placeholder="Enter..." required minlength="8">
        <button type="submit">Redefinir senha</button>
    </form>
</body>
</html>
