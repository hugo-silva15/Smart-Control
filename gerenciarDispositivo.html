<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala</title>
    <link rel="stylesheet" href="assets/css/gerenciarDispositivo.css">
</head>
<body>
    <header>
        <div id="esquerda">
            <img src="assets/images/Capturar.PNG" alt="Logo" id="logo">
            <h1>Gerenciar dispositivos</h1>
        </div>

        <div id="direita">
            <div class="menu_">
                <button class="btn btn-secondary dropdown-toggle" id="botao_menu" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Menu
                </button>
                <ul class="dropdown-menu menu-opcoes_">
                  <li id="ir_telaLogin"><a href="index.html">Tela de Login</a></li>
                  <li class="link"><a href="dashboard.html">Dashboard</a></li>
                  <li class="link"><a href="quarto.html">Quarto Principal</a></li>
                  <li class="link"><a href="sala.html">Sala</a></li>
                  <li class="link"><a href="cozinha.html">Cozinha</a></li>
                  <li class="link"><a href="gerenciarDispositivo.html">Gerenciar Dispositivos</a></li>
                  <li><button id="btnTema">Modo escuro</button></li>
                </ul>
            </div>
        </div>
    </header>
    <main>
        <div id="boas-vindas" class="welcome"></div>



        <div id="bagulho">
            
            <input type="checkbox" id="adicionar">
            <input type="checkbox" id="remover">
            <div class="gerenciar">
                <h2>Deseja adicionar ou remover dispositivo?</h2>
                <label for="adicionar" class="btn-adicionar">
                    Adicionar dispositivo
                </label>
                <label for="remover" class="btn-remover">
                    Remover dispositivo
                </label>
            </div>
            
            <div class="modal modal-adicionar">
                <div class="caixa-modal" id="modal_adicionar">
                    <button type="button" class="fechar" data-fechar="adicionar" aria-label="Fechar modal de adicionar">×</button>
                    <h2>Nome do Dispositivo</h2>
                    <input type="text" placeholder="Enter..." class="input-adicionar">
                    <h2>Cômodo do dispositivo</h2>
                    <input type="text" placeholder="Enter..." class="input-adicionar">
                    <button type="button" class="btn-adicionar" id="btnCadastrarDispositivo">
                        Cadastrar dispositivo
                    </button>
                </div>
            </div>
            
            <div class="modal modal-remover">
                <div class="caixa-modal" id="modal_remover">
                    <button type="button" class="fechar" data-fechar="remover" aria-label="Fechar modal de remover">×</button>
                    <h2>Nome do Dispositivo</h2>
                    <input type="text" placeholder="Enter..." class="input-remover">
                    <h2>Cômodo do dispositivo</h2>
                    <input type="text" placeholder="Enter..." class="input-remover">
                    <button type="button" class="btn-remover" id="btnRemoverDispositivo">
                        Remover dispositivo
                    </button>
                </div>
            </div>
        </div>







    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="assets/js/main.js" defer></script>
</body>
</html>
