<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça seu Login</title>
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu"/>
</head>
<body>
    <header id="cabecalho">
        <img id="lampada" src="assets/images/Capturar.PNG" alt="Imagem de uma lâmpada">
        <h1>Faça seu Login</h1>
        <span class="material-symbols-outlined icone-menu">menu</span>
    </header>
    <div id="form">
        <form method="get" action="dashboard.html" id="formulario">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu E-mail..." required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha..." required minlength="8">
            <button type="submit">Login</button>
        </form>
        <a href="cadastro.html"><h3>Criar conta</h3></a>
        <a href="esqueci_senha.html"><h3>Esqueci minha senha</h3></a>
    </div>
    <img id="logo" src="assets/images/logo.png" alt="Logo da empresa">
    <script src="assets/js/main.js"></script>
</body>
</html>
