<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça seu Login</title>
</head>
<body>
    <form method="post">
        <img src="assets/images/Capturar.PNG" alt="Logo do aplicativo">
        <img src="assets/images/Capturar_2.PNG">
        <h1>Faça seu Login</h1>
        <label for="nome_completo">E-mail</label><br><br>
        <input type="text" id="email" placeholder="Enter..." required><br><br>

        <label for="cpf">Senha</label><br><br>
        <input type="password" id="senha" placeholder="Enter..." required><br><br>

        <button type="submit">Login</button>
        <h4>Criar conta</h4>
        <h4>Esqueci minha senha</h4>

    </form>
</body>
</html>
