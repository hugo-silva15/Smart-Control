<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça seu Login</title>
</head>
<body>
    <img src="assets/images/Capturar.PNG" alt="Logo do aplicativo">
    <img src="assets/images/Capturar_2.PNG" alt="Menu">
    <form method="post">

        <h1>Faça seu Login</h1>

        <label for="email">E-mail</label><br><br>
        <input type="email" id="email" placeholder="Enter..." required><br><br>

        <label for="senha">Senha</label><br><br>
        <input type="password" id="senha" placeholder="Enter..." required><br><br>

        <button type="submit"><a href="dashboard.html">Login</a></button>

        <a href="cadastro.html"><h4>Criar conta</h4></a>
        <h4>Esqueci minha senha</h4>
    </form>
</body>
</html>
